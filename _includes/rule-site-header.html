{%- comment -%}
  ルールポータルのヘッダーとサイトナビゲーションのドロワー。
  include.toc: 目次ボタンを出すか(条文ページのみ)。
{%- endcomment -%}
{%- assign base = page.rule_base | default: "" -%}
  <!-- ヘッダー -->
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="{{ base }}index.html">DSクラフト ルールポータル</a>
      <nav class="top-nav" aria-label="サイトナビゲーション">
        <a class="dads-link" href="{{ base }}index.html">ホーム</a>
        <a class="dads-link" href="https://www.ds2.uk/">DSトップ</a>
      </nav>
      <div class="header-actions">
        {%- if include.toc %}
        <button class="dads-button" data-type="outline" data-size="sm" id="toc-toggle-btn" type="button">目次</button>
        {%- endif %}
        <button class="dads-hamburger-menu-icon-button" id="drawer-menu-btn" type="button" aria-label="メニュー">
          <svg class="dads-hamburger-menu-icon-button__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 18V16H21V18H3ZM3 13V11H21V13H3ZM3 8V6H21V8H3Z" fill="currentcolor"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- サイトナビゲーションドロワー -->
  <dialog class="dads-drawer" id="site-drawer" data-placement="right" aria-labelledby="site-drawer-heading">
    <h2 id="site-drawer-heading" class="dads-u-visually-hidden">メニュー</h2>
    <div class="dads-drawer__header">
      <button class="dads-hamburger-menu-button" id="drawer-close-btn" type="button">
        <svg class="dads-hamburger-menu-button__icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6.4 18.6-1-1 5.5-5.6-5.6-5.6 1.1-1 5.6 5.5 5.6-5.6 1 1.1L13 12l5.6 5.6-1 1L12 13l-5.6 5.6Z" fill="currentcolor"/>
        </svg>
        閉じる
      </button>
    </div>
    <div class="dads-drawer__body">
      <ul class="dads-menu-list">
        <li><a class="dads-menu-list__item" data-type="standard" data-size="regular" href="{{ base }}index.html"><span class="dads-menu-list__label">ホーム</span></a></li>
        <li><a class="dads-menu-list__item" data-type="standard" data-size="regular" href="https://www.ds2.uk/"><span class="dads-menu-list__label">DSトップ</span></a></li>
      </ul>
    </div>
  </dialog>
