title: DSクラフト ルールポータル
url: "https://www.ds2.uk"

# rule/ 配下のルールページ用コレクション。各ページのfront matterで
# permalink(公開パス)を指定しているため、collectionレベルのpermalinkは設定しない。
# rules は docs より前に書くこと。ガイドの関連条文(_includes/docs-related-rules.html)は、
# 先に変換されたルールのHTMLから条を抜き出すため、この順で変換される必要がある。
collections:
  rules:
    output: true
  # docs/ 配下のガイドページ用コレクション(_docs/<タブ>/*.md、1ファイル ＝ 1章)。
  # 公開パスは各ページのfront matterのpermalinkで /docs/<タブ>/<スラッグ>/ の形に指定する。
  docs:
    output: true
  # ルールの過去の版(_rule_versions/<ルールID>/)。script/rule_history.py が _rules の Git 履歴から
  # 生成する(コミットしない)。公開パスは各ページの permalink で /rule/<ルールID>/<改正したルールのID>.html に指定する。
  rule_versions:
    output: true

# _rules はルール用リポジトリ(ds-craft/rules)のサブモジュール。条文は _rules/rules/ にある。
# 廃止したルールは _rules/rules/repealed/ に置かれており、repealed: true を付けて区別する
# (一覧での「廃止」表示、条文ページの廃止の案内に使う)。
defaults:
  - scope:
      path: "_rules/rules/repealed"
      type: rules
    values:
      repealed: true

# ガイドページの「Markdownを表示」で開く、元のMarkdownファイルの置き場所(GitHubの生ファイル)
docs_source_base: https://raw.githubusercontent.com/ds-craft/portal/main/

# ベンダー同梱の別リポジトリ(design-system-example-components-html)は
# ファイル数が非常に多くビルド対象に含めると重いため除外する。
# skills-lock.jsonはClaude Code用のツール設定でサイトの公開物ではないため除外する。
# README.mdはリポジトリの説明であり、GitHub Pagesでページ化されないよう除外する。
# _rules/ のREADME.md・LICENSEはルール用リポジトリの説明・ライセンス文書で、
# 除外しないと /rules/README.md・/rules/LICENSE として公開されるため除外する。
exclude:
  - rule/design-system-example-components-html
  - skills-lock.json
  - README.md
  - _rules/README.md
  - _rules/LICENSE
# Gemfile・Gemfile.lockはビルド環境の設定、vendor/はGitHub Actionsのビルドでgemが入る場所のため除外する
# (excludeを書くとJekyll既定の除外が上書きされるため、明示する)。
  - Gemfile
  - Gemfile.lock
  - vendor

# ルール条文をMarkdown(_rules/*.md)で書くための変換設定。
# hard_wrap: 条文中の改行(項・号の区切り)をそのまま<br>にする。
# auto_ids: 見出しidは目次スクリプトが見出しの文言から付けるため、kramdownの自動付与を止める
#           (自動付与だと「第8条（窃盗の禁止）」の括弧が除かれ、既存の条文間リンクが切れる)。
kramdown:
  hard_wrap: true
  auto_ids: false
